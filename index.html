<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080e12">
  <title>Crown Run · Pin Puzzle</title>
  <meta name="description" content="Route water, bridge spike pits, and clear a path for the royal racehorse across five pin puzzles.">
  <link rel="icon" href="assets/crest.png">
  <link rel="stylesheet" href="game.css">
  <script src="game.js" defer></script>
</head>
<body>
  <main class="game" id="game" aria-label="Crown Run" data-region="stable">
    <header class="topbar">
      <div class="brand"><img src="assets/crest.png" alt=""><div><strong>Crown Run</strong><small>Royal Pin Trials</small></div></div>
      <div class="chapter"><span id="chapter"></span><h1 id="level-title"></h1></div>
      <div class="top-tools">
        <div class="wallet" aria-label="Coins"><img src="assets/coin.png" alt=""><b id="coins">0</b></div>
        <button class="icon muted" id="sound" type="button" aria-label="Enable audio" aria-pressed="false" title="Toggle audio"><img src="assets/sound.png" alt=""></button>
        <button class="icon" id="fullscreen" type="button" aria-label="Full screen" title="Full screen"><img src="assets/fullscreen.png" alt=""></button>
      </div>
    </header>
    <section class="play">
      <section class="board" id="board" aria-label="Pin puzzle chamber">
        <div id="scenery" aria-hidden="true"></div>
        <div id="actors" aria-hidden="true"></div>
        <div id="pins"></div>
        <div id="effects" aria-hidden="true"></div>
        <div class="zone-caption"><span></span><b id="zone"></b></div>
      </section>
    </section>
    <footer class="controls">
      <button type="button" class="btn" id="map"><img src="assets/map-icon.png" alt="">Level Map</button>
      <p class="status" id="status" role="status"></p>
      <div class="actions">
        <span id="steps" class="step-count" aria-label="Pins pulled"></span>
        <button type="button" class="btn" id="reset"><img src="assets/reset.png" alt="">Reset</button>
      </div>
    </footer>
    <dialog id="map-dialog" class="overlay map-screen" aria-labelledby="map-title">
      <div class="map-top"><div><span class="eyebrow">Crown Run</span><h2 id="map-title">Level Map</h2></div><div class="map-count" id="map-count"></div><button class="icon close" data-close type="button" aria-label="Close map"><img src="assets/close.png" alt=""></button></div>
      <div id="map-nodes"></div>
      <div class="map-bottom">Clear a chamber to unlock the next trial.</div>
    </dialog>
    <dialog id="result" class="overlay result" aria-labelledby="result-title">
      <button class="icon close" data-close type="button" aria-label="Close result"><img src="assets/close.png" alt=""></button>
      <section class="result-card">
        <img id="result-icon" class="result-icon" alt="">
        <p class="eyebrow" id="result-kicker"></p>
        <h2 id="result-title"></h2>
        <p id="result-description"></p>
        <div id="reward"></div>
        <div class="result-actions">
          <button type="button" class="btn" id="again"><img src="assets/reset.png" alt="">Retry</button>
          <button type="button" class="btn gold" id="next"><img src="assets/play.png" alt=""><span>Next Level</span></button>
        </div>
      </section>
    </dialog>
  </main>
</body>
</html>
